# ---------------------------------------------------------------------------
# Sasso Nomad — Nginx com três idiomas (/pt, /it, /en)
#
# Como usar na VM (Google Cloud):
#   1. Copie os três blocos `map` para o seu arquivo em
#      /etc/nginx/sites-available/ — FORA do bloco `server { }` (topo do
#      arquivo). Eles só podem existir uma vez.
#   2. Dentro do `server { }` que tem `listen 443 ssl` (o do Certbot),
#      substitua o `location / { ... }` atual pelos blocos `location` abaixo.
#      Não mexa nas linhas `ssl_certificate` do Certbot.
#   3. Confira o `root` (pasta onde fica o conteúdo de dist/).
#   4. sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

# Idioma escolhido no seletor do site (cookie sn_lang), se houver.
map $cookie_sn_lang $sn_lang_cookie {
    ~^(pt|it|en)$  $cookie_sn_lang;
    default        "";
}

# Idioma principal do navegador (o primeiro da lista Accept-Language).
# pt-BR e pt-PT -> pt · it-IT e it-CH -> it · qualquer outro -> en
map $http_accept_language $sn_lang_browser {
    ~*^pt   pt;
    ~*^it   it;
    default en;
}

# Regra final: cookie > navegador > inglês. Nunca por IP: o Googlebot
# rastreia a partir dos EUA e veria só o inglês.
map $sn_lang_cookie $sn_lang {
    ""      $sn_lang_browser;
    default $sn_lang_cookie;
}

server {
    # --- mantenha aqui o listen 443 ssl / server_name / ssl_* do Certbot ---
    listen 8080;
    server_name sassonomad.com www.sassonomad.com;

    root /var/www/sassonomad;   # pasta com o conteúdo de dist/
    index index.html;
    charset utf-8;

    # Raiz: só redireciona para o idioma certo (302, porque depende de quem
    # visita). O Vary avisa caches/CDNs que a resposta muda por idioma.
    location = / {
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-store" always;
        return 302 /$sn_lang$is_args$args;
    }

    # Páginas por idioma: HTML pré-renderizado pelo build. Páginas de conta
    # (minha área, guias salvos, bem-vindo...) caem no app (index.html).
    location ~ ^/(pt|it|en)(/|$) {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /index.html;
    }

    # Arquivos do build com hash no nome: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Arquivos soltos (favicon, robots.txt, sitemap.xml, /videos, /email...).
    # Qualquer outra URL é do site antigo, sem idioma (/guias, /bem-vindo,
    # /privacidade...): 301 permanente para a versão /pt, mantendo a query
    # (?token=... dos e-mails já enviados continua funcionando).
    location / {
        try_files $uri @legacy;
    }

    location @legacy {
        return 301 /pt$request_uri;
    }
}
